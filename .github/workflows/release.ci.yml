name: Release / CI

on:
  pull_request:
    branches:
      - release
    types: [opened, edited, reopened, synchronize]

jobs:
  validate-pr-title:
    name: validate-pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking PR title: $TITLE"

          # Must be "Release <version>" where version starts with a digit
          if [[ ! "$TITLE" =~ ^Release\ [0-9] ]]; then
            echo "::error::PR title must be 'Release <version>' (e.g., 'Release 2.0.0-beta.6')"
            exit 1
          fi

          echo "PR title is valid."

  verify-diff-matches-main:
    name: verify-diff-matches-main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check diff with main
        run: lune run ./Submodules/luau-cicd/Scripts/CheckDiffWithMain.exec.luau

  check-formatting:
    name: check-formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check formatting
        run: lune run ./Submodules/luau-cicd/Scripts/CheckFormatting.exec.luau

  run-tests:
    name: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install dependencies
        run: wally install

      - name: Run tests
        run: lune run ./Scripts/RunTests.exec.luau

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install dependencies
        run: wally install

      - name: Setup Lune typedefs
        run: lune setup

      - name: Run static analysis
        run: |
          luau-lsp analyze \
            --ignore "DevPackages/**" \
            --ignore "Packages/**" \
            --ignore "Submodules/**" \
            --ignore "src/__tests__/**" \
            --ignore "Scripts/**" \
            .

  validate-version:
    name: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check version match
        run: lune run ./Submodules/luau-cicd/Scripts/CheckVersionMatch.exec.luau

      - name: Check changelog entry
        run: lune run ./Submodules/luau-cicd/Scripts/CheckChangelogVersion.exec.luau

      - name: Check changelog format
        run: lune run ./Submodules/luau-cicd/Scripts/CheckChangelogFormat.exec.luau

      - name: Verify PR title matches VERSION
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: lune run ./Submodules/luau-cicd/Scripts/CheckReleaseTitleVersion.exec.luau "$TITLE"
